<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bg-gradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0d1117"/><stop offset="50%" stop-color="#161b22"/><stop offset="100%" stop-color="#090d11"/></linearGradient><linearGradient id="title-gradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#58a6ff"/><stop offset="50%" stop-color="#bc8cff"/><stop offset="100%" stop-color="#3fb950"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#21262d" stop-opacity=".7"/><stop offset="100%" stop-color="#161b22" stop-opacity=".4"/></linearGradient><linearGradient id="line-grad-1" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#58a6ff" stop-opacity=".2"/><stop offset="50%" stop-color="#58a6ff" stop-opacity=".8"/><stop offset="100%" stop-color="#bc8cff" stop-opacity=".3"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#30363d" stroke-opacity=".3" stroke-width=".5" d="M 40 0 L 0 0 0 40"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse-wave{0%{stroke-dashoffset:1000}}@keyframes float-node{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes bar-grow{0%{height:30px;y:250px}50%{height:65px;y:215px}}@keyframes bar-grow-2{0%{height:50px;y:230px}50%{height:85px;y:195px}}.badge-text,.subtitle,.title{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:42px;fill:url(#title-gradient)}.subtitle{font-weight:500;font-size:18px;fill:#8b949e}.badge-text{font-weight:600;font-size:13px;fill:#c9d1d9}.wave-line{stroke-dasharray:1000;stroke-dashoffset:1000;animation:pulse-wave 8s linear infinite}.floating-card{animation:float-node 6s ease-in-out infinite}.anim-bar-1{animation:bar-grow 4s ease-in-out infinite}.anim-bar-2{animation:bar-grow-2 5s ease-in-out infinite}</style><rect width="1200" height="400" fill="url(#bg-gradient)" rx="16"/><rect width="1200" height="400" fill="url(#grid)" rx="16"/><g opacity=".35"><path fill="none" stroke="url(#line-grad-1)" stroke-width="3" d="M 50 320 Q 200 280, 350 310 T 650 250 T 950 280 T 1150 200" class="wave-line"/><path fill="none" stroke="#3fb950" stroke-opacity=".5" stroke-width="2" d="M 50 350 Q 250 300, 450 330 T 750 220 T 1050 260 T 1150 180" class="wave-line" style="animation-duration:12s"/><rect width="14" height="50" x="850" y="230" fill="#58a6ff" class="anim-bar-1" opacity=".4" rx="3"/><rect width="14" height="70" x="872" y="210" fill="#bc8cff" class="anim-bar-2" opacity=".5" rx="3"/><rect width="14" height="40" x="894" y="240" fill="#3fb950" class="anim-bar-1" opacity=".4" rx="3" style="animation-delay:1s"/><rect width="14" height="85" x="916" y="195" fill="#f0883e" class="anim-bar-2" opacity=".6" rx="3" style="animation-delay:2s"/><rect width="14" height="60" x="938" y="220" fill="#58a6ff" class="anim-bar-1" opacity=".5" rx="3" style="animation-delay:1.5s"/></g><circle cx="150" cy="100" r="120" fill="#58a6ff" filter="url(#glow)" opacity=".08"/><circle cx="1050" cy="120" r="140" fill="#bc8cff" filter="url(#glow)" opacity=".08"/><g transform="translate(60, 130)"><rect width="310" height="32" x="0" y="0" fill="#21262d" stroke="#30363d" stroke-width="1" rx="16"/><circle cx="16" cy="16" r="6" fill="#3fb950"/><text x="32" y="21" class="badge-text">MANAGED OBSERVABILITY &amp; DASHBOARDS</text><text x="0" y="80" class="title">Awesome Managed Observability</text><text x="0" y="120" class="subtitle">Curated Ecosystem of SaaS Platforms, Open-Source Metrics, Logs &amp; Traces Dashboards</text></g><g class="floating-card" transform="translate(800, 70)"><rect width="330" height="80" fill="url(#card-grad)" stroke="#30363d" stroke-width="1" rx="12"/><circle cx="35" cy="40" r="18" fill="#1f6feb" fill-opacity=".3"/><path fill="none" stroke="#58a6ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M 28 40 L 33 45 L 43 33"/><text x="68" y="36" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI" font-size="14" font-weight="600">Unified Dashboards</text><text x="68" y="56" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI" font-size="12" font-weight="400">Metrics • Logs • Traces • Alerts</text></g><g class="floating-card" transform="translate(830, 175)" style="animation-delay:-3s"><rect width="310" height="75" fill="url(#card-grad)" stroke="#30363d" stroke-width="1" rx="12"/><circle cx="35" cy="37" r="18" fill="#238636" fill-opacity=".3"/><path fill="none" stroke="#3fb950" stroke-linecap="round" stroke-width="2.5" d="M 28 37 L 42 37 M 35 30 L 35 44"/><text x="68" y="33" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI" font-size="14" font-weight="600">Open-Source &amp; SaaS</text><text x="68" y="53" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI" font-size="12" font-weight="400">Grafana, SigNoz, Datadog &amp; More</text></g><rect width="1200" height="6" x="0" y="394" fill="url(#title-gradient)"/></svg>